name: Replace release assets

# 專用於「就地替換既有 Release 的附件」：從指定 ref（預設 main）重新建置、用 repo secrets
# 簽章，再以 clobber 覆蓋同名附件。不會建立 Release、不會改版本號、不會動 Release 文字。
# 一般發版請走 release.yml（tag push / workflow_dispatch）。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose assets will be replaced (for example v0.15.0)
        required: true
        type: string
      source_ref:
        description: Git ref to build from
        required: false
        default: main
        type: string
      confirm_tag:
        description: Type the same tag again to confirm overwriting published assets
        required: true
        type: string

permissions:
  contents: read

jobs:
  replace:
    name: Rebuild and replace signed release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Confirm the replacement
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" || "$CONFIRM_TAG" != "$RELEASE_TAG" ]]; then
            echo "::error::confirm_tag must repeat release_tag exactly."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_tag must use vX.Y.Z."
            exit 1
          fi

      - name: Check out the source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # ratchet:actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # ratchet:gradle/actions/setup-gradle@v4

      - name: Validate that the built version matches the release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.Substring(1)
          $gradleText = [System.IO.File]::ReadAllText("app/build.gradle.kts", [System.Text.UTF8Encoding]::new($false, $true))
          $versionPattern = '(?m)^\s*versionName\s*=\s*"' + [regex]::Escape($version) + '"\s*$'
          if ($gradleText -notmatch $versionPattern) {
            throw "The source ref does not declare versionName $version; refusing to replace the assets."
          }

      - name: Validate release signing secrets
        shell: bash
        env:
          KUIESVOX_KEYSTORE_BASE64: ${{ secrets.KUIESVOX_KEYSTORE_BASE64 }}
          KUIESVOX_KEY_ALIAS: ${{ secrets.KUIESVOX_KEY_ALIAS }}
          KUIESVOX_KEY_PASSWORD: ${{ secrets.KUIESVOX_KEY_PASSWORD }}
          KUIESVOX_STORE_PASSWORD: ${{ secrets.KUIESVOX_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KUIESVOX_KEYSTORE_BASE64 KUIESVOX_KEY_ALIAS KUIESVOX_KEY_PASSWORD KUIESVOX_STORE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Configure all required repository Actions secrets before publishing."
            printf 'Missing secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Restore temporary signing keystore
        shell: bash
        env:
          KUIESVOX_KEYSTORE_BASE64: ${{ secrets.KUIESVOX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/kuiesvox-release-signing"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s' "$KUIESVOX_KEYSTORE_BASE64" | base64 --decode > "$key_dir/release.keystore"
          chmod 600 "$key_dir/release.keystore"
          echo "KUIESVOX_KEYSTORE_FILE=$key_dir/release.keystore" >> "$GITHUB_ENV"

      - name: Compile app and test sources
        env:
          KUIESVOX_KEY_ALIAS: ${{ secrets.KUIESVOX_KEY_ALIAS }}
          KUIESVOX_KEY_PASSWORD: ${{ secrets.KUIESVOX_KEY_PASSWORD }}
          KUIESVOX_STORE_PASSWORD: ${{ secrets.KUIESVOX_STORE_PASSWORD }}
        run: ./gradlew :app:compileReleaseKotlin :app:compileDebugUnitTestKotlin --no-daemon

      - name: Run JVM tests
        env:
          KUIESVOX_KEY_ALIAS: ${{ secrets.KUIESVOX_KEY_ALIAS }}
          KUIESVOX_KEY_PASSWORD: ${{ secrets.KUIESVOX_KEY_PASSWORD }}
          KUIESVOX_STORE_PASSWORD: ${{ secrets.KUIESVOX_STORE_PASSWORD }}
        run: ./gradlew test --no-daemon

      - name: Build signed Release APK
        env:
          KUIESVOX_KEY_ALIAS: ${{ secrets.KUIESVOX_KEY_ALIAS }}
          KUIESVOX_KEY_PASSWORD: ${{ secrets.KUIESVOX_KEY_PASSWORD }}
          KUIESVOX_STORE_PASSWORD: ${{ secrets.KUIESVOX_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature and prepare release assets
        id: release-assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "::error::Release APK was not produced at $source_apk."
            exit 1
          fi
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Android SDK path is not configured on the runner."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$source_apk"

          mkdir -p release-assets
          apk_name="KuiesVox-${RELEASE_TAG}.apk"
          sha_name="KuiesVox-${RELEASE_TAG}.sha256"
          cp "$source_apk" "release-assets/$apk_name"
          (cd release-assets && sha256sum "$apk_name" > "$sha_name")
          cat "release-assets/$sha_name"
          echo "apk=release-assets/$apk_name" >> "$GITHUB_OUTPUT"
          echo "sha=release-assets/$sha_name" >> "$GITHUB_OUTPUT"

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: |
          key_file="$RUNNER_TEMP/kuiesvox-release-signing/release.keystore"
          if [[ -f "$key_file" ]]; then
            rm -f -- "$key_file"
            rmdir "$RUNNER_TEMP/kuiesvox-release-signing" 2>/dev/null || true
          fi

      - name: Replace the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_APK: ${{ steps.release-assets.outputs.apk }}
          RELEASE_SHA: ${{ steps.release-assets.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # 只覆蓋同名附件，不動 Release 文字、標題與 prerelease 狀態。
          gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_SHA" --clobber
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,name,assets --jq '{tag: .tagName, prerelease: .isPrerelease, name: .name, assets: [.assets[] | {name: .name, size: .size, state: .state}]}'
